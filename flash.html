<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Designs • Eternally Frozen Tattoo</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.75rem;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      background: #0f0f0f;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery-item:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .gallery-item img {
      width: 100%;
      height: 270px;
      object-fit: contain;
      background: #111;
      padding: 18px 12px;
      transition: transform 0.4s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.03);
    }

    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.95));
      padding: 1.15rem 1.15rem 1.35rem;
      opacity: 0;
      transition: opacity 0.3s ease;
      color: white;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.95);
    }

    .gallery-item:hover .overlay {
      opacity: 1;
    }

    .design-name {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 0.55rem;
      line-height: 1.3;
    }

    .price-list {
      font-size: 1rem;
      line-height: 1.7;
    }

    .price-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .price {
      font-weight: 700;
      color: #e63939;
    }

    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.97);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 94%;
      max-height: 90vh;
      border-radius: 8px;
      box-shadow: 0 10px 60px rgba(0, 0, 0, 0.9);
    }

    .lightbox-close {
      position: absolute;
      top: 25px;
      right: 35px;
      color: #fff;
      font-size: 3.5rem;
      cursor: pointer;
      z-index: 1001;
      line-height: 1;
      user-select: none;
    }
  </style>
</head>

<body>
  <!-- Navigation -->
  <nav>
    <div class="container">
      <div class="nav-content">
        <a href="index.html" class="logo">ETERNALLY FROZEN TATTOO</a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="work.html">Work</a></li>
          <li><a href="flash.html">Flash</a></li>
          <li><a href="book.html">Book</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container" style="padding-top: 3rem; max-width: 1300px;">
    <h1 style="text-align: center; margin-bottom: 0.5rem;">Flash Designs</h1>
    <p style="text-align: center; color: #aaa; margin-bottom: 3rem;">
      Ready-to-go designs. Hover to see sizes and pricing.
    </p>

    <div class="gallery-grid" id="flash-grid"></div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-img" alt="Flash design">
  </div>

  <footer>
    <div class="container">
      <p>© Eternally Frozen Tattoo — Chloe Froese • Chilliwack, BC</p>
  
      <div class="social-links">
        <a href="https://www.instagram.com/eternallyfrozen.ttt/" target="_blank" rel="noopener" aria-label="Instagram">
          <!-- Instagram Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>
  
        <a href="https://www.facebook.com/profile.php?id=61566524044297" target="_blank" rel="noopener"
          aria-label="Facebook">
          <!-- Facebook Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
          </svg>
        </a>
      </div>
    </div>
  </footer>

  <script>
    function parseFlashName(filename) {
      let name = filename.replace(/\.(jpg|jpeg|png|webp)$/i, '');
      const parts = name.split('-');

      let displayNameParts = [];
      const sizePricePairs = [];

      for (let i = 0; i < parts.length; i++) {
        const part = parts[i];
        if (/^\d+(\.\d+)?in$/i.test(part)) {
          sizePricePairs.push({ size: part });
        }
        else if (/^\d+(\.\d+)?$/.test(part) && sizePricePairs.length > 0 && !sizePricePairs[sizePricePairs.length - 1].price) {
          sizePricePairs[sizePricePairs.length - 1].price = part;
        } else {
          displayNameParts.push(part);
        }
      }

      const displayName = displayNameParts.join(' ').replace(/-/g, ' ').trim();

      let priceHTML = '';
      if (sizePricePairs.length > 0) {
        priceHTML = '<div class="price-list">';
        sizePricePairs.forEach(pair => {
          if (pair.size && pair.price) {
            const sizeDisplay = pair.size.replace('in', '"');
            const bookLink = `book.html?design=${encodeURIComponent(displayName)}&size=${encodeURIComponent(pair.size)}&price=${pair.price}`;

            priceHTML += `
                          <div class="price-item">
                              <span>${sizeDisplay}</span> 
                              <span>—</span> 
                              <span class="price">$${pair.price}</span>
                              <a href="${bookLink}" class="book-link" onclick="event.stopImmediatePropagation();">Book</a>
                          </div>
                      `;
          }
        });
        priceHTML += '</div>';
      }

      return { displayName, priceHTML };
    }

    async function loadFlash() {
      const grid = document.getElementById('flash-grid');
      grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #666;">Loading flash designs...</p>';

      try {
        const response = await fetch('https://api.github.com/repos/davefroese012-cloud/eternallyfrozen/contents/images/flash');
        const files = await response.json();

        grid.innerHTML = '';

        const imageFiles = files.filter(file =>
          file.type === 'file' && /\.(jpg|jpeg|png|webp)$/i.test(file.name)
        ).sort((a, b) => a.name.localeCompare(b.name));

        imageFiles.forEach(file => {
          const parsed = parseFlashName(file.name);

          const div = document.createElement('div');
          div.className = 'gallery-item';
          div.innerHTML = `
                      <img src="https://raw.githubusercontent.com/davefroese012-cloud/eternallyfrozen/main/images/flash/${file.name}" 
                           alt="${parsed.displayName}">
                      <div class="overlay">
                          <div class="design-name">${parsed.displayName}</div>
                          ${parsed.priceHTML}
                      </div>
                  `;
          div.onclick = () => openLightbox(
            `https://raw.githubusercontent.com/davefroese012-cloud/eternallyfrozen/main/images/flash/${file.name}`,
            parsed.displayName
          );
          grid.appendChild(div);
        });

      } catch (e) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #e63939;">No flash designs yet.</p>';
      }
    }

    function openLightbox(src, alt) {
      const lightbox = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      img.src = src;
      img.alt = alt;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      const lightbox = document.getElementById('lightbox');
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        const lightbox = document.getElementById('lightbox');
        if (lightbox.classList.contains('active')) closeLightbox();
      }
    });

    loadFlash();
  </script>
</body>

</html>
