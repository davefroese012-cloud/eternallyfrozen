<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work • Eternally Frozen Tattoo • Chloe Froese</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            aspect-ratio: 1 / 1;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.4s ease;
            filter: grayscale(85%);
        }

        .gallery-item:hover img {
            filter: grayscale(0%);
            transform: scale(1.08);
        }

        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
            color: white;
            padding: 1.2rem 1rem 1rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: center;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav>
        <div class="container">
            <div class="nav-content">
                <a href="index.html" class="logo">ETERNALLY FROZEN</a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="work.html">Work</a></li>
                    <li><a href="flash.html">Flash</a></li>
                    <li><a href="book.html">Book</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 3rem;">
        <h1 style="text-align: center; margin-bottom: 0.5rem;">Recent Work</h1>
        <p style="text-align: center; color: #aaa; margin-bottom: 3rem;">Tattoos by Chloe Froese</p>

        <div class="gallery-grid" id="portfolio-grid"></div>

        <div style="text-align: center; margin: 4rem 0;">
            <a href="flash.html" class="cta-button">View Flash Designs & Pricing</a>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" alt="Enlarged tattoo photo">
    </div>

    <footer>
        <div class="container">
            <p>© Eternally Frozen Tattoo — Chloe Froese</p>
        </div>
    </footer>

    <script>
        async function loadGallery(folder, gridId) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #666;">Loading images...</p>';

            try {
                const response = await fetch(`https://api.github.com/repos/davefroese012-cloud/eternallyfrozen/contents/images/${folder}`);
                const files = await response.json();

                grid.innerHTML = '';

                const imageFiles = files.filter(file =>
                    file.type === 'file' && /\.(jpg|jpeg|png|webp)$/i.test(file.name)
                );

                imageFiles.forEach(file => {
                    const name = file.name.replace(/\.(jpg|jpeg|png|webp)$/i, '');
                    const displayName = name.replace(/-/g, ' ');

                    const div = document.createElement('div');
                    div.className = 'gallery-item';
                    div.innerHTML = `
                        <img src="https://raw.githubusercontent.com/davefroese012-cloud/eternallyfrozen/main/images/${folder}/${file.name}" 
                             alt="${displayName}">
                        <div class="overlay">
                            <h4>${displayName}</h4>
                        </div>
                    `;
                    div.onclick = () => openLightbox(
                        `https://raw.githubusercontent.com/davefroese012-cloud/eternallyfrozen/main/images/${folder}/${file.name}`,
                        displayName
                    );
                    grid.appendChild(div);
                });

            } catch (e) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #e63939;">Error loading images. Please refresh.</p>';
            }
        }

        function openLightbox(src, alt) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = src;
            img.alt = alt;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Load Portfolio
        loadGallery('portfolio', 'portfolio-grid');
    </script>
</body>

</html>
